<div class="login-wrap" id="loginView">

<script type="module">
  /* ===== V4 · [K1] Adapter Firebase v2 ===== */
  // Kết nối thật vào Firebase Realtime Database — giữ nguyên 100% firebaseConfig
  // và API cũ (doc().set/get/delete, collection().onSnapshot), đồng thời bổ sung
  // update, transaction, multi, onConnection, serverOffset, FIREBASE_READY.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getDatabase, ref, set, get, remove, onValue, update, runTransaction }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDkVBjLD4FVKWL2wkAeM48Q-8PKJVV1c6c",
    authDomain: "money-3273d.firebaseapp.com",
    databaseURL: "https://money-3273d-default-rtdb.firebaseio.com",
    projectId: "money-3273d",
    storageBucket: "money-3273d.firebasestorage.app",
    messagingSenderId: "798055443947",
    appId: "1:798055443947:web:440305518c32c609f2fdae",
    measurementId: "G-C27MKKBNPL"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);
    let _offset = 0;
    let _connected = true;

    onValue(ref(rtdb, '.info/serverTimeOffset'), s => {
      const v = s.val();
      _offset = typeof v === 'number' && Number.isFinite(v) ? v : 0;
    }, () => {});

    onValue(ref(rtdb, '.info/connected'), s => {
      _connected = !!s.val();
    }, () => {});

    window.FIREBASE_STORE = {
      doc(path){
        const r = ref(rtdb, path);
        return {
          async set(data){ await set(r, data); },
          async get(){ const snap = await get(r); return { exists: snap.exists(), data: snap.val() }; },
          async delete(){ await remove(r); },
          async update(part){ await update(r, part); },
          async transaction(fn){
            const res = await runTransaction(r, fn, { applyLocally: false });
            return {
              committed: !!res.committed,
              exists: res.snapshot ? res.snapshot.exists() : false,
              data: res.snapshot ? res.snapshot.val() : null
            };
          }
        };
      },
      collection(path){
        const r = ref(rtdb, path);
        return {
          onSnapshot(cb, errCb){
            return onValue(r, snap => {
              const val = snap.val() || {};
              cb({ docs: Object.entries(val).map(([id, data]) => ({ id, data })) });
            }, err => { if (errCb) errCb(err); });
          }
        };
      },
      async multi(map){
        await update(ref(rtdb), map);
      },
      onConnection(cb){
        return onValue(ref(rtdb, '.info/connected'), s => cb(!!s.val()), () => cb(false));
      },
      isConnected(){ return _connected; },
      serverOffset(){ return _offset; }
    };
    window.FIREBASE_READY = Promise.resolve(true);
  } catch (err) {
    console.error('Firebase init failed:', err);
    window.FIREBASE_ERROR = err;
    window.FIREBASE_READY = Promise.resolve(false);
  }
  /* ===== /V4 ===== */
</script>
